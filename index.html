  else if(b.t==="li")s=b.mk+" "+md(b.runs);else s=md(b.runs);
  if(!s.trim())continue;
  if(b.t==="p"&&/^(#|>|\d+\.\s|-\s|\+\s)/.test(s))s="\\"+s;
  if(opt.pb&&b.pg!==lastPg){out.push("---");lastPg=b.pg}
  out.push((b.t==="li"&&prevT==="li"&&out.length&&out[out.length-1].startsWith("\u0000"))?s:s);prevT=b.t;
  if(b.t==="li")out[out.length-1]="\u0000"+out[out.length-1]}
 let res="";out.forEach((s,k)=>{const li=s[0]==="\u0000",pl=k&&out[k-1][0]==="\u0000";const t=li?s.slice(1):s;res+=(k?(li&&pl?"\n":"\n\n"):"")+t});
 return res.trim()+"\n"}
function readOpts(){opt={tables:$("#oT").checked,cols:$("#oC").checked,hf:$("#oH").checked,dh:$("#oD").checked,fa:$("#oF").checked,pb:$("#oP").checked}}
async function convert(){if(!srcBuf)return;readOpts();$("#go").disabled=true;say("Reading PDF…");prog(.02);
 try{const pdf=await pdfjsLib.getDocument({data:new Uint8Array(srcBuf.slice(0))}).promise,pages=[],fc={};
  for(let n=1;n<=pdf.numPages;n++){pages.push(await readPage(pdf,n,fc));prog(n/pdf.numPages*.9);say("Analyzing page "+n+" of "+pdf.numPages+"…");await tick()}
  const m=toMarkdown(pages);$("#out").value=m;prog(1);setStats();render();
  if(!$("#msg").classList.contains("wa"))say("Done · "+pdf.numPages+" page"+(pdf.numPages>1?"s":"")+" converted.","ok")}
 catch(e){prog(1);say(e&&e.name==="PasswordException"?"This PDF is password-protected.":"Could not convert this PDF: "+(e.message||e),"er")}
 $("#go").disabled=false}
function setStats(){const v=$("#out").value.trim();$("#st").textContent=v?v.split(/\s+/).length.toLocaleString()+" words · "+v.length.toLocaleString()+" chars":""}
function render(){const pv=$("#pv");pv.innerHTML=window.marked?marked.parse($("#out").value):"";pv.querySelectorAll("p,li,h1,h2,h3,h4,h5,h6,td,th").forEach(e=>e.setAttribute("dir","auto"))}
function setBuf(buf,name){srcBuf=buf;srcName=name||"document.pdf";$("#fn").textContent="✓ "+srcName+" ("+(buf.byteLength/1048576).toFixed(2)+" MB)";$("#go").disabled=false;convert()}
async function fromFile(f){if(!f)return;if(!/pdf$/i.test(f.type||f.name)){say("Please choose a PDF file.","er");return}setBuf(await f.arrayBuffer(),f.name)}
const drop=$("#drop"),fi=$("#file");
drop.onclick=()=>fi.click();drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" ")fi.click()};fi.onchange=()=>fromFile(fi.files[0]);
["dragenter","dragover"].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.add("hot")}));
["dragleave","drop"].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.remove("hot")}));
drop.addEventListener("drop",e=>fromFile(e.dataTransfer.files[0]));
$("#load").onclick=async()=>{const u=$("#url").value.trim();if(!/^https?:\/\//i.test(u)){say("Enter a valid http(s) address.","er");return}
 say("Downloading…");try{const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);setBuf(await r.arrayBuffer(),decodeURIComponent(u.split("?")[0].split("/").pop()||"document.pdf"))}
 catch(e){say("The browser could not fetch this address (the server may block cross-site requests, or this page is sandboxed). Download the PDF and use Upload instead.","er")}};
$("#go").onclick=convert;
$("#tU").onclick=()=>{$("#tU").classList.add("on");$("#tL").classList.remove("on");$("#pU").classList.remove("hide");$("#pL").classList.add("hide")};
$("#tL").onclick=()=>{$("#tL").classList.add("on");$("#tU").classList.remove("on");$("#pL").classList.remove("hide");$("#pU").classList.add("hide")};
$("#vM").onclick=()=>{$("#vM").classList.add("on");$("#vP").classList.remove("on");$("#out").classList.remove("hide");$("#pv").classList.add("hide")};
$("#vP").onclick=()=>{render();$("#vP").classList.add("on");$("#vM").classList.remove("on");$("#pv").classList.remove("hide");$("#out").classList.add("hide")};
$("#out").oninput=()=>{setStats();render()};
$("#copy").onclick=async()=>{const t=$("#out").value;if(!t)return;try{await navigator.clipboard.writeText(t)}catch(e){$("#out").select();document.execCommand("copy")}say("Copied to clipboard.","ok")};
$("#save").onclick=async()=>{const t=$("#out").value;if(!t){say("Nothing to save yet.","er");return}const name=srcName.replace(/\.pdf$/i,"")+".md";
 try{const d=window.claude&&await claude.use("downloads");
  if(d){await d.save({filename:name,data:new Blob([t],{type:"text/markdown;charset=utf-8"})});say("Save requested: "+name,"ok");return}}catch(e){if(e&&e.code==="declined")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/markdown;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();a.remove()};
$("#theme").onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dk?"light":"dark"};
</script>
